steps:
  # Step 1: Clone the repository
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', 'https://github.com/JAY-reddy1029/nvidia-cdc-framework.git', '.']
    id: 'clone-repo'

  # Step 2: Install Dataform CLI
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install', '-g', '@dataform/cli']
    id: 'install-dataform-cli'

  # Step 3: Install workspace dependencies
  - name: 'gcr.io/cloud-builders/npm'
    dir: 'dataform'
    args: ['install']
    id: 'install-dataform-deps'

  # Step 4: Compile Dataform
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'dataform', 'compile', '--dir=dataform']
    id: 'dataform-compile'

  # Step 5: Deploy to production
  - name: 'gcr.io/cloud-builders/npm'
    args:
      - 'run'
      - 'dataform'
      - 'release'
      - 'deploy'
      - '--project-id=project-a2f79f6e-db67-4726-be8'
      - '--release-config-name=production'
    env:
      - 'DATAFORM_CORE_VERSION=3.0.52'
    id: 'dataform-deploy'

# Build timeout
timeout: '1800s'

# Logging configuration - use Cloud Logging only
logging: CLOUD_LOGGING_ONLY

# Substitutions
substitutions:
  _PROJECT_ID: 'project-a2f79f6e-db67-4726-be8'
  _DATAFORM_VERSION: '3.0.52'
  _RELEASE_CONFIG: 'production'
