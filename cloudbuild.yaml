steps:
  # Step 1: Clone the repository
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', '--depth', '1', 'https://github.com/JAY-reddy1029/nvidia-cdc-framework.git', '/workspace/repo']
    id: 'clone-repo'

  # Step 2: Install Dataform CLI
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install', '-g', '@dataform/cli@3.0.52']
    id: 'install-dataform-cli'

  # Step 3: Compile Dataform
  - name: 'gcr.io/cloud-builders/gke-deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd /workspace/repo/dataform
        /root/.npm-global/bin/dataform compile
    id: 'dataform-compile'

  # Step 4: Deploy to production
  - name: 'gcr.io/cloud-builders/gke-deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd /workspace/repo/dataform
        /root/.npm-global/bin/dataform release deploy \
          --project-id=project-a2f79f6e-db67-4726-be8 \
          --release-config-name=production
    id: 'dataform-deploy'
    env:
      - 'DATAFORM_CORE_VERSION=3.0.52'

# Build timeout
timeout: '1800s'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
