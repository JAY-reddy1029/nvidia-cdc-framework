steps:
  # Step 1: Clone the repository
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', 'https://github.com/JAY-reddy1029/nvidia-cdc-framework.git', '.']
    id: 'clone-repo'

  # Step 2: Install Node.js dependencies for Dataform
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install', '-g', '@dataform/cli']
    id: 'install-dataform-cli'

  # Step 3: Compile Dataform (validate all SQLX files)
  - name: 'gcr.io/cloud-builders/npm'
    dir: 'dataform'
    args: ['install']
    id: 'install-dataform-deps'

  # Step 4: Compile and validate the Dataform workspace
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args: 
      - run
      - -f
      - dataform/
    env:
      - 'DATAFORM_CLI_VERSION=3.0.52'
    id: 'dataform-compile'

  # Step 5: Run Dataform release deploy to production
  - name: 'gcr.io/cloud-builders/npm'
    args:
      - run
      - 'dataform'
      - 'release'
      - 'deploy'
      - '--project-id=project-a2f79f6e-db67-4726-be8'
      - '--release-config-name=production'
    env:
      - 'DATAFORM_CORE_VERSION=3.0.52'
    id: 'dataform-deploy'

# Build timeout
timeout: '1800s'

# Optional: Send notification on success/failure
onFailure:
  - 'echo Deployment failed! Check logs above.'

onSuccess:
  - 'echo Dataform deployment successful! Files compiled and released to production.'

# Substitute variables (optional - for dynamic project IDs)
substitutions:
  _PROJECT_ID: 'project-a2f79f6e-db67-4726-be8'
  _DATAFORM_VERSION: '3.0.52'
  _RELEASE_CONFIG: 'production'

# Images used in the build
images:
  - 'gcr.io/cloud-builders/npm'
  - 'gcr.io/cloud-builders/git'
