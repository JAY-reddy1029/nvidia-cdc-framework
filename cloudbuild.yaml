steps:
  # Step 1: Clone the repository
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', '--depth', '1', 'https://github.com/JAY-reddy1029/nvidia-cdc-framework.git', '/workspace/repo']
    id: 'clone-repo'

  # Step 2: Compile Dataform (validation only, no deploy)
  - name: 'gcr.io/cloud-builders/npm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Installing Dataform CLI..."
        npm install -g @dataform/cli@3.0.52
        
        echo "Navigating to dataform directory..."
        cd /workspace/repo/dataform
        
        echo "Compiling Dataform for validation..."
        dataform compile
        
        echo "✅ Dataform compilation successful!"
        echo "All 10 actions compiled successfully."
        echo "CI/CD validation pipeline complete!"
    env:
      - 'DATAFORM_CORE_VERSION=3.0.52'
    id: 'dataform-compile'

# Build timeout
timeout: '1800s'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
